# Render blueprint for C.O.R.E.
#
# One web service (API + built web app) and one managed PostgreSQL instance.
# Import this from the Render dashboard: New → Blueprint → point at this repo.
services:
  - type: web
    name: core
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /readiness
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      # Render injects the connection string from the database below.
      - key: DATABASE_URL
        fromDatabase:
          name: core-db
          property: connectionString
      # Generated once by Render and kept stable, so sessions survive deploys.
      - key: SESSION_SECRET
        generateValue: true
      # Set this to the service's public URL after the first deploy.
      - key: APP_URL
        sync: false
      # Optional. Without SMTP_URL, verification codes go to the service log
      # and no email is sent.
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        value: C.O.R.E. <no-reply@core.local>
      # Optional Google sign-in. The button stays hidden while these are unset.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DEMO_MODE_ENABLED
        value: "true"

databases:
  - name: core-db
    plan: basic-256mb
    postgresMajorVersion: "17"
