# Render blueprint for C.O.R.E.
#
# One web service (API + built web app) and one managed PostgreSQL instance,
# both on Render's free tier.

services:
  - type: web
    name: core
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /readiness

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 4000

      # Render injects the internal PostgreSQL connection string.
      - key: DATABASE_URL
        fromDatabase:
          name: core-db
          property: connectionString

      # Render's PostgreSQL certificate is self-signed.
      # CORE's production DB client otherwise rejects it.
      - key: DATABASE_SSL_INSECURE_SKIP_VERIFY
        value: "true"

      # Generated once by Render and kept stable across deploys.
      - key: SESSION_SECRET
        generateValue: true

      # Render automatically provides RENDER_EXTERNAL_URL.
      # APP_URL is therefore intentionally not required.
      #
      # Optional SMTP configuration.
      - key: SMTP_URL
        sync: false

      - key: MAIL_FROM
        value: C.O.R.E. <no-reply@core.local>

      # Optional Google sign-in.
      - key: GOOGLE_CLIENT_ID
        sync: false

      - key: GOOGLE_CLIENT_SECRET
        sync: false

      - key: DEMO_MODE_ENABLED
        value: "true"

databases:
  - name: core-db
    plan: free
    postgresMajorVersion: "17"