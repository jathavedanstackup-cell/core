# Local C.O.R.E.
#
#   docker compose up -d --build     the whole product at http://localhost:4000
#   docker compose up -d postgres    just the database, for `npm run dev`
#
# Port 5433 for Postgres deliberately: 5432 is often already taken by another
# project, and colliding with it would be a poor first experience.

services:
  postgres:
    image: postgres:17-alpine
    container_name: core-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: core
      POSTGRES_USER: core
      POSTGRES_PASSWORD: core_local_dev
    ports:
      - "5433:5432"
    volumes:
      - core_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core -d core"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: core-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      # sslmode=disable because this database sits on the compose network and
      # has no certificate. Never do this for a database reached over the
      # public internet; the service logs a warning either way.
      DATABASE_URL: postgresql://core:core_local_dev@postgres:5432/core?sslmode=disable
      SESSION_SECRET: local-development-secret-not-for-production-use-ever
      APP_URL: http://localhost:4000
      DEMO_MODE_ENABLED: "true"
      LOG_LEVEL: info
    ports:
      - "4000:4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  core_postgres_data:
